# Render 배포 설정 (https://render.com → New → Blueprint → 이 저장소)
# 역사담 RAG 백엔드: backend/main.py (FastAPI)
services:
  - type: web
    name: historydam-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # 아래 키들은 Render 대시보드에서 직접 입력 (저장소에 올리지 않음)
      - key: GEMINI_API_KEY
        sync: false
      - key: PUBLIC_API_KEY
        sync: false
      - key: KDP_API_KEY
        sync: false
